# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Local dev proxy (this machine: WinHttp-based tools time out, but the JVM can
# route through the local HTTP proxy to reach dl.google.com / repo.maven.apache.org).
# Harmless on machines with direct network access.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=52062
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=52062
systemProp.http.nonProxyHosts=localhost|127.0.0.1
